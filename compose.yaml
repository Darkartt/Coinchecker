name: coinchecker
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coinchecker
      POSTGRES_USER: coinchecker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coinchecker_local}
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U coinchecker -d coinchecker']
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:56379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    profiles: ['production']
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://coinchecker:${POSTGRES_PASSWORD:-coinchecker_local}@postgres:5432/coinchecker
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports: ['127.0.0.1:3001:3001']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
