name: Verify Coinchecker
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coinchecker
          POSTGRES_USER: coinchecker
          POSTGRES_PASSWORD: coinchecker_test
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U coinchecker -d coinchecker"
          --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['56379:6379']
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://coinchecker:coinchecker_test@localhost:55432/coinchecker
      REDIS_URL: redis://localhost:56379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:integration
      - run: npm run test:sites -w @coinchecker/extension
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: coinchecker-extension
          path: artifacts/coinchecker-extension-*.zip*
